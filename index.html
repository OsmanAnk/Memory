<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <section class="home d_none" id="home">
        <div class="home__intro">
            <h2 class="home__h2">It's play time.</h2>
            <h1 class="home__h1">Ready to play?</h1>
        </div>

        <button class="play" id="play">
            <img class="play__icon" src="assets/icons/stadia_controller_icon.svg" alt="">
            <p class="play__p">Play</p>
            <span class="play__arrow" aria-hidden="true"></span>
        </button>

        <img class="controller" src="assets/img/stadia_controller.svg" alt="">
    </section>

    <section class="settings" id="settings">
        <div class="headline">
            <h1 class="headline__h1">Settings</h1>
            <img class="headline__underline" src="assets/icons/Line 3.svg" alt="">
        </div>
        <div class="main">
            <div class="options">
                <div class="option option--themes">
                    <div class="option__head">
                        <img class="option__icon" src="assets/icons/palette.svg" alt="">
                        <span class="option__title">Game themes</span>
                    </div>
                    <div class="choices">
                        <label class="choices__label">
                            <input class="choices__item" type="checkbox" name="theme" id="theme-code-vibes">
                            Code vibes theme
                        </label>
                        <label class="choices__label">
                            <input class="choices__item" type="checkbox" name="theme" id="theme-gaming">
                            Gaming theme
                        </label>
                        <label class="choices__label">
                            <input class="choices__item" type="checkbox" name="theme" id="theme-da-projects">
                            DA Projects theme
                        </label>
                        <label class="choices__label">
                            <input class="choices__item" type="checkbox" name="theme" id="theme-foods">
                            Foods theme
                        </label>
                    </div>
                </div>
                <div class="option option--players">
                    <div class="option__head">
                        <img class="option__icon" src="assets/icons/chess_pawn.svg" alt="">
                        <span class="option__title">Choose player</span>
                    </div>
                    <div class="choices">
                        <label class="choices__label">
                            <input class="choices__item" type="checkbox" name="player" id="player-blue">
                            Blue
                        </label>
                        <label class="choices__label">
                            <input class="choices__item" type="checkbox" name="player" id="player-orange">
                            Orange
                        </label>
                    </div>
                </div>
                <div class="option option--board">
                    <div class="option__head">
                        <img class="option__icon" src="assets/icons/style.svg" alt="">
                        <span class="option__title">Board size</span>
                    </div>
                    <div class="choices">
                        <label class="choices__label">
                            <input class="choices__item" type="checkbox" name="board-size" id="board-size-16">
                            16 cards
                        </label>
                        <label class="choices__label">
                            <input class="choices__item" type="checkbox" name="board-size" id="board-size-24">
                            24 cards
                        </label>
                        <label class="choices__label">
                            <input class="choices__item" type="checkbox" name="board-size" id="board-size-36">
                            36 cards
                        </label>
                    </div>

                </div>
            </div>
            <div class="preview">
                <div class="preview__image">
                    <img class="preview__img" src="" alt="">
                </div>
                <div class="preview__actions">

                </div>
            </div>
        </div>

    </section>

    <!-- <section id="field">
        <button class="card">
            <div class="card__inner">
                <div class="card__face"> </div>
                <div class="card__face card__face--back"> </div>
            </div>
        </button>
    </section> -->
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
