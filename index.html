<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <section class="home d_none" id="home">
        <div class="home__intro">
            <h2 class="home__h2">It's play time.</h2>
            <h1 class="home__h1">Ready to play?</h1>
        </div>

        <button class="play" id="play">
            <img class="play__icon" src="assets/icons/stadia_controller_icon.svg" alt="">
            <p class="play__p">Play</p>
            <span class="play__arrow" aria-hidden="true"></span>
        </button>

        <img class="controller" src="assets/img/stadia_controller.svg" alt="">
    </section>

    <section class="settings" id="settings">
        <div class="main">
            <div class="settings__left">
                <div class="headline">
                    <h1 class="headline__h1">Settings</h1>
                    <img class="headline__underline" src="assets/icons/Line 3.svg" alt="">
                </div>
                <div class="options">
                    <div class="option option--themes">
                        <div class="option__head">
                            <img class="option__icon" src="assets/icons/palette.svg" alt="">
                            <span class="option__title">Game themes</span>
                        </div>
                        <div class="choices">
                            <label class="choices__label">
                                <input class="choices__item choices__item--theme" type="checkbox" name="theme"
                                    id="theme-code-vibes" checked>
                                <span class="choices__text">Code vibes theme</span>
                            </label>
                            <label class="choices__label">
                                <input class="choices__item choices__item--theme" type="checkbox" name="theme"
                                    id="theme-gaming">
                                <span class="choices__text">Gaming theme</span>
                            </label>
                            <label class="choices__label">
                                <input class="choices__item choices__item--theme" type="checkbox" name="theme"
                                    id="theme-da-projects">
                                <span class="choices__text">DA Projects theme</span>
                            </label>
                            <label class="choices__label">
                                <input class="choices__item choices__item--theme" type="checkbox" name="theme"
                                    id="theme-foods">
                                <span class="choices__text">Foods theme</span>
                            </label>
                        </div>
                    </div>
                    <div class="option option--players">
                        <div class="option__head">
                            <img class="option__icon" src="assets/icons/chess_pawn.svg" alt="">
                            <span class="option__title">Choose player</span>
                        </div>
                        <div class="choices">
                            <label class="choices__label">
                                <input class="choices__item choices__item--player" type="checkbox" name="player"
                                    id="player-blue">
                                <span class="choices__text">Blue</span>
                            </label>
                            <label class="choices__label">
                                <input class="choices__item choices__item--player" type="checkbox" name="player"
                                    id="player-orange">
                                <span class="choices__text">Orange</span>
                            </label>
                        </div>
                    </div>
                    <div class="option option--board">
                        <div class="option__head">
                            <img class="option__icon" src="assets/icons/style.svg" alt="">
                            <span class="option__title">Board size</span>
                        </div>
                        <div class="choices">
                            <label class="choices__label">
                                <input class="choices__item choices__item--board" type="checkbox" name="board-size"
                                    id="board-size-16">
                                <span class="choices__text">16 cards</span>
                            </label>
                            <label class="choices__label">
                                <input class="choices__item choices__item--board" type="checkbox" name="board-size"
                                    id="board-size-24">
                                <span class="choices__text">24 cards</span>
                            </label>
                            <label class="choices__label">
                                <input class="choices__item choices__item--board" type="checkbox" name="board-size"
                                    id="board-size-36">
                                <span class="choices__text">36 cards</span>
                            </label>
                        </div>

                    </div>
                </div>
            </div>
            <div class="settings__right">
                <div class="preview">
                    <div class="preview__image">
                        <img id="preview-code-vibes" class="preview__img" src="assets/img/IT logos.svg" alt="">
                        <img id="preview-gaming" class="preview__img d_none" src="assets/img/gameing.svg" alt="">
                        <img id="preview-da-projects" class="preview__img d_none" src="assets/img/DA projects.svg"
                            alt="">
                        <img id="preview-foods" class="preview__img d_none" src="assets/img/foods.svg" alt="">
                    </div>
                </div>
                <div class="chosen">
                    <span class="chosen__theme" id="chosen__theme">Code vibes theme</span>
                    <img class="chosen__line" src="assets/icons/Line 6.svg" alt="">
                    <img class="chosen__line-3 d_none" src="assets/icons/Line 3 short.svg" alt="">
                    <span class="chosen__player" id="chosen__player">Player</span>
                    <img class="chosen__line" src="assets/icons/Line 6.svg" alt="">
                    <img class="chosen__line-3 d_none" src="assets/icons/Line 3 short.svg" alt="">
                    <span class="chosen__board" id="chosen__board">Board size</span>
                    <button class="chosen__button play">
                        <img class="play__icon" src="assets/icons/smart_display.svg" alt="">
                        <p class="play__p">Start</p>
                    </button>
                </div>
            </div>
        </div>

    </section>

        <button class="card">
            <div class="card__inner">
                <div class="card__face"> </div>
                <div class="card__face card__face--back"> </div>
            </div>
        </button>
    </section> -->
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
